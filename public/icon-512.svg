<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded app icon square -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>

  <!-- Academic Crest Shield -->
  <path d="M 256 70 C 340 70 380 90 380 90 C 380 260 256 390 256 390 C 256 390 132 260 132 90 C 132 90 172 70 256 70 Z" 
        fill="#0F172A" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round"/>

  <!-- Golden Crown on Crest -->
  <path d="M 210 145 L 225 180 L 256 135 L 287 180 L 302 145 L 305 200 L 207 200 Z" fill="url(#goldGrad)"/>
  <circle cx="210" cy="140" r="5" fill="#FEF08A"/>
  <circle cx="256" cy="130" r="6" fill="#FEF08A"/>
  <circle cx="302" cy="140" r="5" fill="#FEF08A"/>

  <!-- Graduation Cap & Technology Emblem -->
  <!-- Mortarboard Cap -->
  <polygon points="256,220 330,250 256,280 182,250" fill="url(#goldGrad)"/>
  <!-- Cap Base -->
  <path d="M 210 262 Q 256 288 302 262 L 302 285 Q 256 312 210 285 Z" fill="#CA8A04"/>
  <!-- Tassel -->
  <path d="M 330 250 L 338 275 L 334 305" fill="none" stroke="#FDE047" stroke-width="4" stroke-linecap="round"/>
  <circle cx="334" cy="308" r="4" fill="#FDE047"/>

  <!-- Circuit lines inside shield bottom -->
  <path d="M 210 320 L 240 320 L 256 345 L 272 320 L 302 320" fill="none" stroke="#6366F1" stroke-width="5" stroke-linecap="round"/>
  <circle cx="210" cy="320" r="4" fill="#818CF8"/>
  <circle cx="256" cy="345" r="5" fill="#818CF8"/>
  <circle cx="302" cy="320" r="4" fill="#818CF8"/>

  <!-- Ribbon Banner at Bottom -->
  <path d="M 120 420 L 160 400 L 352 400 L 392 420 L 368 448 L 144 448 Z" fill="#1E293B" stroke="url(#goldGrad)" stroke-width="5"/>
  <text x="256" y="432" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="2">NEXGEN ACADEMY</text>
</svg>
